:root{
  /* fixed light theme on every device — stops browsers (Android/Samsung) from auto-darkening */
  color-scheme: only light;

  /* dark brown — used only for header / hero / footer / admin surfaces */
  --bg-deep:      #472A1A;
  --bg-panel-2:   #5A3A27;

  /* warm harmonized body — deeper toasted cream that pairs with the dark brown surfaces */
  --bg-page:      #E8DDC6;
  --bg-card:      #FBF6EC;
  --bg-card-2:    #F2E9D6;

  --ink:          #3A2418;
  --ink-soft:     #7A6652;
  --cream:        #F1E7D3;
  --cream-dim:    #CBB690;

  --amber:        #B4712E;
  --amber-bright: #C98A3E;
  --amber-tint:   #F0DDBB;
  --bamboo:       #6E8253;
  --bamboo-dark:  #556B41;
  --rust:         #A8432B;

  --line:         rgba(58,36,24,0.14);
  --line-dark:    rgba(244,232,214,0.14);

*{ box-sizing:border-box; }

html{ scroll-behavior:smooth; }

body{
  background:var(--bg-page);
  color:var(--ink);
  font-family:var(--font-body);
  font-feature-settings:"tnum" 1;
  position:relative;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed; inset:0;
  background-image:var(--food-dark);
  background-repeat:repeat;
  background-size:300px;
  opacity:0.04;
  pointer-events:none;
  z-index:0;
}

.container-narrow{ max-width:1180px; margin:0 auto; padding:0 20px; position:relative; z-index:1; }

/* ---------- Header ---------- */
.site-header{
  position:sticky; top:0; z-index:1000;
  background:var(--bg-deep);
  border-bottom:1px solid var(--line-dark);
}
.header-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 20px; max-width:1180px; margin:0 auto;
}
.brand{ display:flex; align-items:center; gap:12px; }
/* crop out the left emblem: show only the "Bamboo Society Beer" text (right ~67% of the artwork) */
.brand-logo{
  display:block; height:52px; width:auto; aspect-ratio:538 / 255;
  background:var(--logo) right center / auto 100% no-repeat;
  filter:brightness(0) invert(1);
}
.off-logo{ height:40px; }

.kebab-btn{
  background:transparent; border:1px solid var(--line-dark); color:var(--cream);
  width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s, border-color .2s;
}
.kebab-btn:hover{ background:rgba(244,232,214,0.08); border-color:var(--amber-bright); }
.kebab-btn svg{ width:22px; height:22px; }

/* ---------- Category pill nav ---------- */
.cat-nav-wrap{
  position:sticky; top:73px; z-index:900;
  background:var(--bg-page);
  border-bottom:1px solid var(--line);
}
/* animated "swipe →" hint on the category bar; hidden for good once user scrolls it */
.nav-hint{
  position:absolute; right:0; top:0; bottom:1px;
  display:flex; align-items:center; justify-content:flex-end;
  width:64px; padding-right:9px;
  pointer-events:none;
  background:linear-gradient(to right, rgba(232,221,198,0), var(--bg-page) 58%);
  transition:opacity .45s ease;
}
.nav-hint.hide{ opacity:0; }
.nav-hint-badge{
  width:30px; height:30px; border-radius:50%;
  background:var(--amber); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.22);
  animation:navNudge 1.25s ease-in-out infinite;
}
.nav-hint-badge svg{ width:17px; height:17px; display:block; }
@keyframes navNudge{
  0%,100%{ transform:translateX(0); box-shadow:0 2px 8px rgba(0,0,0,0.22); }
  50%{ transform:translateX(5px); box-shadow:0 2px 12px rgba(180,113,46,0.5); }
}
@media (prefers-reduced-motion: reduce){
  .nav-hint-badge{ animation:none; }
}
.cat-nav-inner{ position:relative; max-width:1180px; margin:0 auto; }
.cat-nav{
  display:flex; gap:8px; overflow-x:auto; padding:12px 20px;
  scrollbar-width:thin; scrollbar-color:var(--amber) transparent;
}
.cat-nav::-webkit-scrollbar{ height:5px; }
.cat-nav::-webkit-scrollbar-thumb{ background:var(--amber); border-radius:10px; }
.cat-pill{
  flex:0 0 auto;
  padding:7px 16px; border-radius:999px;
  border:1px solid var(--line); color:var(--ink-soft);
  font-size:.82rem; letter-spacing:.03em; text-transform:uppercase; font-weight:600;
  white-space:nowrap; text-decoration:none;
  transition:all .2s;
  background:var(--bg-card);
}
.cat-pill:hover, .cat-pill.active{
  background:var(--bg-deep); border-color:var(--bg-deep); color:var(--cream);
}

/* ---------- Hero ---------- */
.hero{
  position:relative;
  padding:64px 20px 52px;
  text-align:center;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(201,138,62,0.14), transparent 62%),
    var(--bg-deep);
  border-bottom:1px solid var(--line-dark);
  overflow:hidden;
}
.hero::before{
  content:""; position:absolute; inset:0; z-index:0;
  background-image:var(--food-light);
  background-repeat:repeat; background-size:230px;
  opacity:0.07; pointer-events:none;
}
.hero-logo{
  position:relative; z-index:1;
  display:block; margin:0 auto;
  width:min(330px, 78vw); height:auto; aspect-ratio:538 / 255;
  background:var(--logo) right center / auto 100% no-repeat;
  filter:brightness(0) invert(1);
  opacity:0; animation:fadeUp .9s ease .1s forwards;
}
.hero-meta{
  position:relative; z-index:1;
  display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:26px;
  opacity:0; animation:fadeUp .9s ease .3s forwards;
}
.chip{
  display:inline-flex; align-items:center; gap:7px;
  border:2px solid rgba(232,221,198,0.55); border-radius:999px; padding:8px 17px;
  font-size:.8rem; letter-spacing:.04em; text-transform:uppercase; font-weight:700;
  color:var(--bg-page); background:transparent;
}
.chip strong{ color:var(--bg-page); font-weight:700; }

@keyframes fadeUp{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }

@media (prefers-reduced-motion: reduce){
  .hero-logo, .hero-meta{ animation:none; opacity:1; }
}

/* ---------- Bamboo divider (signature element) ---------- */
.bamboo-divider{
  display:flex; align-items:center; gap:6px; margin:0 0 22px;
}
.bamboo-divider svg{ height:22px; width:auto; flex:0 0 auto; }
.bamboo-divider .line{ flex:1; height:1px; background:linear-gradient(90deg, var(--bamboo), transparent); }

/* ---------- Category sections (PDF-style two-tone) ---------- */
.category-section{
  position:relative; scroll-margin-top:150px;
  padding:46px 0 40px;
  /* per-section theme tokens (defaults = light/cream page) */
  --sec-ink:#3A2418;
  --sec-soft:#8A755E;
  --sec-dot:rgba(58,36,24,0.30);
  --sec-chip-bg:#FFFFFF;
  --sec-chip-ink:#5A3A27;
  --sec-doodle:var(--food-dark);
  background:var(--bg-page);
  color:var(--sec-ink);
}
.category-section.sec-dark{
  --sec-ink:#F1E7D3;
  --sec-soft:#C9B291;
  --sec-dot:rgba(241,231,211,0.30);
  --sec-chip-bg:#F6EFE0;
  --sec-chip-ink:#5A3A27;
  --sec-doodle:var(--food-light);
  background:var(--bg-deep);
}
.category-section::before{
  content:""; position:absolute; inset:0; z-index:0;
  background-image:var(--sec-doodle);
  background-repeat:repeat; background-size:250px;
  opacity:0.05; pointer-events:none;
}
.category-section > .container-narrow{ position:relative; z-index:1; }

.category-head{
  display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:4px;
  flex-wrap:wrap;
}
.category-head h2{
  font-family:var(--font-display); font-weight:700; letter-spacing:.02em; text-transform:uppercase;
  font-size:clamp(1.35rem,3.6vw,2rem);
  color:var(--sec-ink); margin:0;
  border:2px solid var(--sec-ink); border-radius:12px;
  padding:6px 18px; line-height:1.1;
}
.category-note{
  font-size:.72rem; color:var(--sec-chip-ink); text-transform:uppercase; letter-spacing:.05em; font-weight:700;
  background:var(--sec-chip-bg); border-radius:999px; padding:5px 12px;
}

/* column headers (1 pessoa / 2 pessoas · dose / litro ...) */
.col-headers{
  display:flex; justify-content:flex-end; gap:8px; margin:14px 0 4px;
}
.col-headers span{
  min-width:74px; text-align:center;
  font-size:.64rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--sec-soft);
}

.items-list{ display:flex; flex-direction:column; margin-top:8px; }

.menu-row{ padding:9px 0; border-bottom:1px dashed var(--sec-dot); }
.menu-row:last-of-type{ border-bottom:none; }
.menu-item{ display:flex; align-items:flex-end; gap:8px; position:relative; }
.mi-name{
  font-family:var(--font-display); font-weight:600; font-size:.98rem; line-height:1.25;
  text-transform:uppercase; color:var(--sec-ink); letter-spacing:.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
}
.mi-dots{ flex:1; min-width:14px; border-bottom:2px dotted var(--sec-dot); transform:translateY(-4px); }
.mi-prices{ display:flex; gap:8px; flex:0 0 auto; }
.price-chip{
  min-width:74px; text-align:center;
  background:var(--sec-chip-bg); color:var(--sec-chip-ink);
  border-radius:7px; padding:5px 10px;
  font-weight:700; font-size:.9rem; white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,0.10);
}
.price-chip.empty{ background:transparent; box-shadow:none; color:var(--sec-soft); }
.mi-obs{
  font-size:.74rem; color:var(--sec-soft); margin-top:3px;
  text-transform:uppercase; letter-spacing:.03em; line-height:1.3;
}
@media (max-width:520px){
  .mi-name{ white-space:normal; }
  .price-chip, .col-headers span{ min-width:58px; font-size:.82rem; padding:5px 7px; }
}

/* decorative photo accents */
.deco-img{
  position:absolute; width:120px; height:auto; opacity:0.9; pointer-events:none;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,0.45));
}
.deco-tomato{ top:-10px; right:-14px; width:92px; transform:rotate(8deg); }

/* ---------- Footer ---------- */
.site-footer{
  margin-top:60px; padding:40px 0 90px;
  border-top:1px solid var(--line-dark);
  background:var(--bg-deep);
  position:relative; overflow:hidden;
}
.site-footer::before{
  content:""; position:absolute; inset:0; z-index:0;
  background-image:var(--food-light);
  background-repeat:repeat; background-size:260px;
  opacity:0.05; pointer-events:none;
}
.footer-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
@media (max-width:640px){ .footer-grid{ grid-template-columns:1fr; } }
.ticket{
  background:linear-gradient(180deg, rgba(201,138,62,0.10), rgba(90,58,39,0.35));
  border:1px solid rgba(227,166,89,0.35);
  border-left:4px solid var(--amber-bright);
  border-radius:var(--radius);
  padding:20px 22px; position:relative;
  box-shadow:0 6px 18px rgba(0,0,0,0.22);
}
.ticket h3{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.03em;
  font-size:1.02rem; color:var(--amber-bright); margin:0 0 12px;
}
.ticket p{ font-size:.9rem; color:var(--cream); margin:5px 0; }
.ticket p strong{ color:var(--amber-bright); font-weight:700; letter-spacing:.02em; }
.footer-note{ text-align:center; font-size:.78rem; color:var(--cream-dim); margin-top:28px; opacity:.85; }

/* ---------- Offcanvas customization ---------- */
.offcanvas.bamboo-off{
  background:var(--bg-deep); color:var(--cream); border-left:1px solid var(--line-dark); width:300px;
}
.offcanvas.bamboo-off .offcanvas-header{ border-bottom:1px solid var(--line-dark); }
.offcanvas.bamboo-off .btn-close{ filter:invert(1) grayscale(1) brightness(1.8); }
.off-admin-btn{
  margin-top:18px; width:100%; padding:10px; border-radius:10px;
  background:var(--amber); border:none; color:#24140F; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.off-admin-btn:hover{ background:var(--amber-bright); }

/* ---------- Admin ---------- */
.admin-bar{
  position:fixed; bottom:0; left:0; right:0; z-index:1050;
  background:var(--bg-panel-2); border-top:2px solid var(--bamboo);
  padding:10px 16px; display:none; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  box-shadow:0 -6px 20px rgba(0,0,0,0.4);
}
.admin-bar.show{ display:flex; }
.admin-bar .badge-mode{
  background:var(--bamboo); color:#182410; font-weight:700; font-size:.72rem;
  padding:5px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.05em;
}
.btn-bamboo{ background:var(--amber); border:none; color:#24140F; font-weight:700; }
.btn-bamboo:hover{ background:var(--amber-bright); color:#24140F; }
.btn-bamboo-outline{ background:transparent; border:1px solid var(--cream-dim); color:var(--cream); }
.btn-bamboo-outline:hover{ border-color:var(--amber); color:var(--amber-bright); }
.btn-danger-soft{ background:rgba(168,67,43,0.2); border:1px solid var(--rust); color:#f0b8a8; }
.btn-danger-soft:hover{ background:var(--rust); color:#fff; }

.item-edit-actions{
  display:none; gap:6px; flex:0 0 auto; align-self:center; margin-left:4px;
}
.editing .item-edit-actions{ display:flex; }
.icon-btn{
  width:30px; height:30px; padding:0; border-radius:8px;
  border:1px solid var(--sec-dot, var(--line));
  background:transparent; color:var(--sec-soft, var(--ink-soft));
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  flex:0 0 auto; line-height:0;
}
.icon-btn:hover{ color:var(--amber-bright); border-color:var(--amber-bright); }
.icon-btn svg{ width:15px; height:15px; display:block; }

.add-item-btn{
  display:none; margin-top:12px; padding:10px; width:100%;
  border:1.5px dashed var(--bamboo); border-radius:var(--radius);
  background:transparent; color:var(--bamboo); font-weight:600;
}
.editing .add-item-btn{ display:block; }
.add-item-btn:hover{ background:rgba(124,148,100,0.14); color:var(--amber-bright); border-color:var(--amber-bright); }

.cat-edit-actions{ display:none; gap:8px; align-items:center; }
.editing .cat-edit-actions{ display:flex; }

.add-category-card{
  display:none; margin:40px auto 0; max-width:1180px;
}
.editing .add-category-card{ display:block; }

/* modal theming */
.modal-content.bamboo-modal{
  background:var(--bg-panel-2); color:var(--cream); border:1px solid var(--line-dark); border-radius:var(--radius);
}
.bamboo-modal .modal-header{ border-bottom:1px solid var(--line-dark); }
.bamboo-modal .modal-footer{ border-top:1px solid var(--line-dark); }
.bamboo-modal label{ font-size:.82rem; color:var(--cream-dim); font-weight:600; margin-bottom:4px; }
.bamboo-modal .form-control, .bamboo-modal .form-select{
  background:var(--bg-deep); border:1px solid var(--line-dark); color:var(--cream);
}
.bamboo-modal .form-control:focus, .bamboo-modal .form-select:focus{
  background:var(--bg-deep); color:var(--cream); border-color:var(--amber-bright);
  box-shadow:0 0 0 .2rem rgba(201,138,62,0.25);
}
.bamboo-modal .btn-close{ filter:invert(1) grayscale(1) brightness(1.8); }
.modal-backdrop.show{ opacity:.7; }

.login-error{ color:#f0b8a8; font-size:.85rem; margin-top:8px; display:none; }

::selection{ background:var(--amber); color:#24140F; }

a{ color:var(--amber-bright); }

/* focus visibility */
a:focus-visible, button:focus-visible, .cat-pill:focus-visible{
  outline:2px solid var(--amber-bright); outline-offset:2px;
}

</style>
</head>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-logo" role="img" aria-label="Bamboo Society Beer"></span>
    </div>
    <button class="kebab-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#siteOffcanvas" aria-controls="siteOffcanvas" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
  </div>
</header>

<div class="cat-nav-wrap">

      <span class="nav-hint-badge">

      </span>
    </div>
  </div>
</div>

<div class="offcanvas offcanvas-end bamboo-off" tabindex="-1" id="siteOffcanvas" aria-labelledby="siteOffcanvasLabel">

    <span class="brand-logo off-logo" role="img" aria-label="Bamboo Society Beer"></span>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
  </div>
  <div class="offcanvas-body">
    <button class="off-admin-btn" type="button" data-bs-toggle="modal" data-bs-target="#loginModal">

</div>

<div class="hero">

    <span class="chip">🕒 <strong id="info-hours">—</strong></span>

</div>

      + Adicionar nova categoria

<footer class="site-footer">

      </div>

</footer>

<div class="admin-bar" id="adminBar">

  <button class="btn btn-bamboo-outline btn-sm" id="btnResetDefault">Restaurar cardápio original</button>
  <button class="btn btn-danger-soft btn-sm" id="btnLogout">Sair</button>
</div>

<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">

    <div class="modal-content bamboo-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="loginModalLabel" style="font-family:var(--font-display);">Área do administrador</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form id="loginForm">
        <div class="modal-body">
          <div class="mb-3">
            <label for="loginUser">Usuário</label>
            <input type="text" class="form-control" id="loginUser" autocomplete="username" required>
          </div>
          <div class="mb-2">
            <label for="loginPass">Senha</label>
            <input type="password" class="form-control" id="loginPass" autocomplete="current-password" required>
          </div>
          <div class="login-error" id="loginError">Usuário ou senha incorretos.</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-bamboo-outline" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-bamboo">Entrar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bamboo-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="itemModalTitle" style="font-family:var(--font-display);">Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form id="itemForm">
        <div class="modal-body">
          <div class="mb-3">
            <label for="itemName">Nome do item</label>
            <input type="text" class="form-control" id="itemName" required>
          </div>
          <div class="mb-3">
            <label for="itemObs">Observação (opcional)</label>
            <input type="text" class="form-control" id="itemObs" placeholder="Ex.: acompanha arroz e salada">
          </div>
          <div class="row" id="itemPriceFields"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-bamboo-outline" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-bamboo">Salvar item</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bamboo-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="categoryModalTitle" style="font-family:var(--font-display);">Categoria</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form id="categoryForm">
        <div class="modal-body">
          <input type="hidden" id="catEditingId">
          <div class="mb-3">
            <label for="catName">Nome da categoria</label>
            <input type="text" class="form-control" id="catName" required>
          </div>
          <div class="mb-3">
            <label for="catNote">Observação (opcional)</label>
            <input type="text" class="form-control" id="catNote" placeholder="Ex.: somente aos fins de semana">
          </div>
          <div class="mb-2">
            <label for="catCols">Tipo de preço</label>
            <select class="form-select" id="catCols">
              <option value="unico">Preço único</option>
              <option value="p1,p2">1 pessoa / 2 pessoas</option>
              <option value="dose,litro">Dose / Litro</option>
              <option value="dose,garrafa">Dose / Garrafa</option>
              <option value="taca,garrafa">Taça / Garrafa</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-bamboo-outline" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-bamboo">Salvar categoria</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
/* ============================================================
   BAMBOO SOCIETY BEER — lógica do cardápio + painel admin
   Armazenamento: localStorage (por navegador/dispositivo)
   ============================================================ */

const COL_LABELS = {
  unico: '', p1:'1 pessoa', p2:'2 pessoas',
  dose:'Dose', litro:'Litro', taca:'Taça', garrafa:'Garrafa'
};

let DEFAULT_DATA = null;
let menuData = null;
let editMode = false;

function fmtPrice(v){
  return 'R$ ' + Number(v).toFixed(2).replace('.', ',');
}

function loadDefaultData(){
  const el = document.getElementById('default-menu-data');
  DEFAULT_DATA = JSON.parse(el.textContent);
}

/* -------- Menu data: shared for everyone via Firebase Firestore -------- */
let navHintReady = false;

function applyMenuData(){
  renderAll();
  const i = (menuData && menuData.info) || {};
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v || '—'; };
  set('info-hours', i.hours);
  set('info-note', i.note);
  set('info-wifiname', i.wifiName);
  set('info-wifipass', i.wifiPass);
  set('info-notice', i.notice);
  if(!navHintReady){ navHintReady = true; setupNavHint(); }
}

// Live subscription: every visitor's page updates instantly when the admin saves.
function subscribeMenu(){
  window.__menuDoc.onSnapshot((doc) => {
    menuData = doc.exists ? doc.data() : JSON.parse(JSON.stringify(DEFAULT_DATA));
    applyMenuData();
  }, (err) => {
    console.error('Firestore:', err);
    if(!menuData){ menuData = JSON.parse(JSON.stringify(DEFAULT_DATA)); applyMenuData(); }
  });
}

// Writes the whole menu to the shared DB. Allowed only for the logged-in admin (Firestore rules).
function saveMenuData(){
  if(!window.__menuDoc) return;
  window.__menuDoc.set(menuData).catch((err) => {
    console.error('Salvar:', err);
    alert('Não foi possível salvar no servidor. Confirme que você entrou como admin e está com internet.');
  });
}

function isLoggedIn(){
  return !!(window.__auth && window.__auth.currentUser);
}

/* ---------------- Rendering ---------------- */

function iconSvg(name){
  const icons = {
    pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    kebab:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>'
  };
  return icons[name] || '';
}

function bambooDividerSvg(){
  return `<svg viewBox="0 0 60 22" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#7C9464" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="4" y1="4" x2="4" y2="18"/>
      <line x1="14" y1="2" x2="14" y2="20"/>
      <line x1="24" y1="4" x2="24" y2="18"/>
      <circle cx="4" cy="11" r="1.4" fill="#7C9464" stroke="none"/>
      <circle cx="14" cy="11" r="1.4" fill="#7C9464" stroke="none"/>
      <circle cx="24" cy="11" r="1.4" fill="#7C9464" stroke="none"/>
    </g>
  </svg>`;
}

function renderCatNav(){
  const nav = document.getElementById('catNav');
  nav.innerHTML = menuData.categories.map(c =>
    `<a class="cat-pill" href="#cat-${c.id}" data-cat="${c.id}">${c.name}</a>`
  ).join('');
}

function isSingle(cols){ return cols.length === 1 && cols[0] === 'unico'; }

function renderPrices(item, cols){
  return cols.map(c => {
    const v = item.prices[c];
    return (v != null)
      ? `<span class="price-chip">${fmtPrice(v)}</span>`
      : `<span class="price-chip empty">—</span>`;
  }).join('');
}

function renderColHeaders(cols){
  if(isSingle(cols)) return '';
  return `<div class="col-headers">` +
    cols.map(c => `<span>${COL_LABELS[c] || ''}</span>`).join('') +
    `</div>`;
}

function renderSections(){
  const wrap = document.getElementById('sectionsWrap');
  wrap.innerHTML = '';
  menuData.categories.forEach((cat, ci) => {
    const section = document.createElement('section');
    section.className = 'category-section' + (ci % 2 === 1 ? ' sec-dark' : '');
    section.id = 'cat-' + cat.id;

    section.innerHTML = `
      <div class="container-narrow">
        <div class="category-head">
          <h2>${cat.name}</h2>
          <div style="display:flex; align-items:center; gap:10px;">
            ${cat.note ? `<span class="category-note">${cat.note}</span>` : ''}
            <div class="cat-edit-actions">
              <button class="icon-btn" title="Editar categoria" onclick="openCategoryModal('${cat.id}')">${iconSvg('pencil')}</button>
              <button class="icon-btn" title="Excluir categoria" onclick="deleteCategory('${cat.id}')">${iconSvg('trash')}</button>
            </div>
          </div>
        </div>
        ${renderColHeaders(cat.cols)}
        <div class="items-list" data-cat-id="${cat.id}"></div>
        <button class="add-item-btn" onclick="openItemModal('${cat.id}', null)">+ Adicionar item em “${cat.name}”</button>
      </div>
    `;
    wrap.appendChild(section);

    const list = section.querySelector('.items-list');
    cat.items.forEach((item, ii) => {
      const row = document.createElement('div');
      row.className = 'menu-row';
      row.innerHTML = `
        <div class="menu-item">
          <span class="mi-name">${item.name}</span>
          <span class="mi-dots"></span>
          <span class="mi-prices">${renderPrices(item, cat.cols)}</span>
          <div class="item-edit-actions">
            <button class="icon-btn" title="Editar item" onclick="openItemModal('${cat.id}', ${ii})">${iconSvg('pencil')}</button>
            <button class="icon-btn" title="Excluir item" onclick="deleteItem('${cat.id}', ${ii})">${iconSvg('trash')}</button>
          </div>
        </div>
        ${item.obs ? `<div class="mi-obs">${item.obs}</div>` : ''}
      `;
      list.appendChild(row);
    });
  });
  applyEditModeClasses();
  setupScrollSpy();
}

function renderAll(){
  renderCatNav();
  renderSections();
}

/* ---------------- Scroll spy for pill nav ---------------- */
function setupScrollSpy(){
  const sections = Array.from(document.querySelectorAll('.category-section'));
  const pills = Array.from(document.querySelectorAll('.cat-pill'));
  if(!sections.length) return;
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const id = en.target.id.replace('cat-','');
        pills.forEach(p => p.classList.toggle('active', p.dataset.cat === id));
      }
    });
  }, { rootMargin: '-160px 0px -70% 0px', threshold: 0 });
  sections.forEach(s => obs.observe(s));
}

/* ---------------- Edit mode ---------------- */
function applyEditModeClasses(){
  document.body.classList.toggle('editing', editMode);
}

function setEditMode(on){
  editMode = on;
  applyEditModeClasses();
  document.getElementById('adminBar').classList.toggle('show', isLoggedIn());
}

/* ---------------- Auth ---------------- */
async function attemptLogin(user, pass){
  const email = user.includes('@') ? user : (user + '@bamboo.app');
  try{
    await window.__auth.signInWithEmailAndPassword(email, pass);
    return true;
  }catch(e){
    console.error('Login:', e.code || e.message);
    return false;
  }
}

function logoutAdmin(){
  if(window.__auth) window.__auth.signOut();
  setEditMode(false);
  document.getElementById('adminBar').classList.remove('show');
}

/* ---------------- Category CRUD ---------------- */
function openCategoryModal(catId){
  const modalEl = document.getElementById('categoryModal');
  const form = document.getElementById('categoryForm');
  form.reset();
  document.getElementById('categoryModalTitle').textContent = catId ? 'Editar categoria' : 'Nova categoria';
  document.getElementById('catEditingId').value = catId || '';
  if(catId){
    const cat = menuData.categories.find(c=>c.id===catId);
    document.getElementById('catName').value = cat.name;
    document.getElementById('catNote').value = cat.note || '';
    document.getElementById('catCols').value = cat.cols.join(',');
  }
  new bootstrap.Modal(modalEl).show();
}

function saveCategoryFromForm(ev){
  ev.preventDefault();
  const id = document.getElementById('catEditingId').value;
  const name = document.getElementById('catName').value.trim();
  const note = document.getElementById('catNote').value.trim();
  const colsRaw = document.getElementById('catCols').value;
  const cols = colsRaw.split(',').map(s=>s.trim()).filter(Boolean);
  if(!name || !cols.length) return;

  if(id){
    const cat = menuData.categories.find(c=>c.id===id);
    cat.name = name; cat.note = note || undefined; cat.cols = cols;
  } else {
    const newId = 'cat_' + Date.now();
    menuData.categories.push({ id:newId, name, note: note || undefined, cols, items:[] });
  }
  saveMenuData();
  renderAll();
  bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
}

function deleteCategory(catId){
  const cat = menuData.categories.find(c=>c.id===catId);
  if(!cat) return;
  if(!confirm(`Excluir a categoria "${cat.name}" e todos os seus itens?`)) return;
  menuData.categories = menuData.categories.filter(c=>c.id!==catId);
  saveMenuData();
  renderAll();
}

/* ---------------- Item CRUD ---------------- */
let itemModalCtx = { catId:null, index:null };

function openItemModal(catId, index){
  itemModalCtx = { catId, index };
  const cat = menuData.categories.find(c=>c.id===catId);
  const item = index != null ? cat.items[index] : null;

  document.getElementById('itemModalTitle').textContent = item ? 'Editar item' : 'Novo item';
  document.getElementById('itemName').value = item ? item.name : '';
  document.getElementById('itemObs').value = item ? (item.obs || '') : '';

  const priceFields = document.getElementById('itemPriceFields');
  priceFields.innerHTML = cat.cols.map(c => {
    const label = COL_LABELS[c] || 'Preço';
    const val = item && item.prices[c] != null ? item.prices[c] : '';
    return `
      <div class="col-6 mb-2">
        <label>${label || 'Preço'}</label>
        <input type="number" step="0.01" min="0" class="form-control price-input" data-col="${c}" value="${val}">
      </div>`;
  }).join('');

  new bootstrap.Modal(document.getElementById('itemModal')).show();
}

function saveItemFromForm(ev){
  ev.preventDefault();
  const { catId, index } = itemModalCtx;
  const cat = menuData.categories.find(c=>c.id===catId);
  const name = document.getElementById('itemName').value.trim();
  const obs = document.getElementById('itemObs').value.trim();
  if(!name) return;

  const prices = {};
  document.querySelectorAll('#itemPriceFields .price-input').forEach(inp=>{
    const col = inp.dataset.col;
    if(inp.value !== '') prices[col] = parseFloat(inp.value);
  });

  const newItem = { name, prices };
  if(obs) newItem.obs = obs;

  if(index != null){
    cat.items[index] = newItem;
  } else {
    cat.items.push(newItem);
  }
  saveMenuData();
  renderAll();
  bootstrap.Modal.getInstance(document.getElementById('itemModal')).hide();
}

function deleteItem(catId, index){
  const cat = menuData.categories.find(c=>c.id===catId);
  const item = cat.items[index];
  if(!confirm(`Excluir "${item.name}"?`)) return;
  cat.items.splice(index,1);
  saveMenuData();
  renderAll();
}

function resetToDefault(){
  if(!confirm('Isso vai restaurar o cardápio original para TODOS os visitantes. Continuar?')) return;
  menuData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveMenuData();
  renderAll();
}

/* ---------------- Init ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  loadDefaultData();
  try { subscribeMenu(); } catch(e){ console.error('Firebase indisponível:', e); }

  // Safety net: if Firebase is slow or blocked, still show the menu (default) instead of a blank page.
  setTimeout(() => {
    if(!menuData){ menuData = JSON.parse(JSON.stringify(DEFAULT_DATA)); applyMenuData(); }
  }, 4000);

  if(!window.__auth){ return; }
  // Firebase keeps the admin signed in across reloads; reflect it in the UI.
  window.__auth.onAuthStateChanged((user) => {
    const bar = document.getElementById('adminBar');
    if(user){
      bar.classList.add('show');
      // Seed the shared menu the first time an admin appears (doc doesn't exist yet).
      window.__menuDoc.get().then((d) => { if(!d.exists && menuData){ saveMenuData(); } }).catch(()=>{});
    } else {
      bar.classList.remove('show');
      if(editMode){
        setEditMode(false);
        const b = document.getElementById('btnToggleEdit');
        if(b) b.textContent = 'Entrar no modo edição';
      }
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    if(await attemptLogin(user, pass)){
      err.style.display = 'none';
      bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
      document.getElementById('loginForm').reset();
      document.getElementById('adminBar').classList.add('show');
      const off = bootstrap.Offcanvas.getInstance(document.getElementById('siteOffcanvas'));
      if(off) off.hide();
    } else {
      err.style.display = 'block';
    }
  });

  document.getElementById('categoryForm').addEventListener('submit', saveCategoryFromForm);
  document.getElementById('itemForm').addEventListener('submit', saveItemFromForm);

  document.getElementById('btnLogout').addEventListener('click', logoutAdmin);
  document.getElementById('btnToggleEdit').addEventListener('click', ()=>{
    setEditMode(!editMode);
    document.getElementById('btnToggleEdit').textContent = editMode ? 'Sair do modo edição' : 'Entrar no modo edição';
  });
  document.getElementById('btnAddCategory').addEventListener('click', ()=>openCategoryModal(null));
  document.getElementById('btnResetDefault').addEventListener('click', resetToDefault);
});

/* ---------------- Category nav: smooth scroll (same page, no navigation) ---------------- */
function scrollToCategory(catId){
  const target = document.getElementById('cat-' + catId);
  if(!target) return;
  const header = document.querySelector('.site-header');
  const navWrap = document.querySelector('.cat-nav-wrap');
  const offset = (header ? header.offsetHeight : 0) + (navWrap ? navWrap.offsetHeight : 0) + 16;
  const top = target.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({ top, behavior: 'smooth' });
}

document.addEventListener('click', (ev) => {
  const link = ev.target.closest('.cat-pill');
  if(!link) return;
  ev.preventDefault();
  scrollToCategory(link.dataset.cat);
});

/* ---------------- "Deslize →" hint on the category bar ---------------- */
// Called from applyMenuData() after the first render (pills exist by then).
function setupNavHint(){
  const hint = document.getElementById('navHint');
  const nav = document.getElementById('catNav');
  if(!hint || !nav) return;
  const SEEN_KEY = 'bambooNavHintSeen';

  // Already learned on this device, or bar isn't scrollable → don't show at all.
  if(localStorage.getItem(SEEN_KEY) || nav.scrollWidth <= nav.clientWidth + 4){
    hint.remove();
    return;
  }

  let done = false;
  const dismiss = () => {
    if(done) return;
    done = true;
    localStorage.setItem(SEEN_KEY, '1');
    hint.classList.add('hide');
    nav.removeEventListener('scroll', onScroll);
    setTimeout(() => hint.remove(), 500);
  };
  const onScroll = () => { if(nav.scrollLeft > 8) dismiss(); };
  nav.addEventListener('scroll', onScroll, { passive:true });
}
